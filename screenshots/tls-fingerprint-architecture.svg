  <text x="560" y="170" fill="#34d399" font-family="monospace" font-size="11">JA4: t13d080700_6aee0a5c6037_7a239c5f797f</text>
  <text x="560" y="190" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">JA3: 9a2c611c7c2c5b92c96b691a1259b878 (Python Requests)</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#071b22" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ZERO-TRUST BOT DEFENSE GUARANTEES:</text>
